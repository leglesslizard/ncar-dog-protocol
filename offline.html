<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c2c2c">
  <title>Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f9f7f4;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .box {
      max-width: 36rem;
      margin: 3rem auto;
      background: #fff;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>You’re offline</h1>
    <p>The latest version of this site was cached and should still be available here.</p>
    <p>Reconnect to the internet and refresh the page to get the newest content.</p>
  </div>
</body>
</html>
