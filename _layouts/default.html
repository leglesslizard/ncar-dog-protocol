<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#2c2c2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NCAR Info">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icons/manifest-icon.svg' | relative_url }}" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f9f7f4;
      margin: 0;
      padding: 0;
    }

    .site-header {
      background: #2c2c2c;
      padding: 1.25rem 2rem;
    }

    .site-header a {
      color: #fff;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .site-header a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>NCAR Information</p>
  </footer>
  <script>
    if ( 'serviceWorker' in navigator ) {
      window.addEventListener( 'load', function() {
        navigator.serviceWorker.register( '{{ "/sw.js" | relative_url }}' ).catch( function() {} );
      } );
    }
  </script>
</body>
</html>
