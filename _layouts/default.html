<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#2c2c2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NCAR Info">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icons/manifest-icon.svg' | relative_url }}" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f9f7f4;
      margin: 0;
      padding: 0;
    }

    .site-header {
      background: #2c2c2c;
      padding: 1.25rem 2rem;
    }

    .site-header a {
      color: #fff;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .site-header a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #ddd;
    }

    .scroll-to-top {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 9999;
      width: 3rem;
      height: 3rem;
      border: none;
      border-radius: 999px;
      background: #2c2c2c;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(0.75rem);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .scroll-to-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .scroll-to-top:hover {
      background: #1a1a1a;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>NCAR Information</p>
  </footer>
  <button class="scroll-to-top" type="button" aria-label="Scroll to top" title="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"/>
      <path d="m5 12 7-7 7 7"/>
    </svg>
  </button>
  <script>
    const scrollButton = document.querySelector( '.scroll-to-top' );

    function toggleScrollButton() {
      if ( !scrollButton ) return;
      if ( window.scrollY > 220 ) {
        scrollButton.classList.add( 'visible' );
      } else {
        scrollButton.classList.remove( 'visible' );
      }
    }

    if ( scrollButton ) {
      scrollButton.addEventListener( 'click', function() {
        window.scrollTo( { top: 0, behavior: 'smooth' } );
      } );
      window.addEventListener( 'scroll', toggleScrollButton, { passive: true } );
      toggleScrollButton();
    }

    if ( 'serviceWorker' in navigator ) {
      window.addEventListener( 'load', function() {
        navigator.serviceWorker.register( '{{ "/sw.js" | relative_url }}' ).catch( function() {} );
      } );
    }
  </script>
</body>
</html>
